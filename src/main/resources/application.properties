
spring.application.name=apitestplatform
server.port=8080

#PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/apitestplatform
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Upload limits
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

#Secret and SSRF
app.encryption-key=${APP_ENCRYPTION_KEY}
app.ssrf.allow-private-network=false

# Execution engine
app.execution.max-response-bytes=1048576
app.execution.max-response-time-ms=5000
app.execution.max-total-time-ms=30000
app.execution.delay-ms=100
app.execution.max-tests-per-run=2000

# AI service (the URL comes from config, never from user input)
app.ai.base-url=http://127.0.0.1:8000
app.ai.internal-key=${AI_SERVICE_KEY}
app.ai.timeout-seconds=45
app.ai.max-batch=25
app.ai.delay-ms=1500